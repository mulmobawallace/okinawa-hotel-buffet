<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>沖縄ホテルブッフェ帖</title>
  <meta name="description" content="沖縄県内のホテルで楽しめるランチ・ディナーブッフェをエリアや料金で探せるまとめサイト。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">OKINAWA HOTEL BUFFET</p>
      <h1>沖縄ホテルブッフェ帖</h1>
      <p class="lead">那覇の駅近ランチから、恩納村リゾートの琉球料理ディナーまで。<br />沖縄のホテルブッフェをエリア・時間帯・予算で探せます。</p>
    </div>
    <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C240,80 480,0 720,30 C960,60 1200,10 1440,40 L1440,80 L0,80 Z" />
    </svg>
  </header>

  <main class="container">
    <section class="filters" aria-label="絞り込み">
      <div class="field search">
        <label for="q">キーワード</label>
        <input id="q" type="search" placeholder="ホテル名・料理・特徴（例: 琉球料理、駅近）" />
      </div>

      <div class="field">
        <span class="label">エリア</span>
        <div class="chips" id="areaChips"></div>
      </div>

      <div class="field">
        <span class="label">時間帯</span>
        <div class="chips" id="mealChips"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="budget">大人1名の予算</label>
          <select id="budget">
            <option value="">指定なし</option>
            <option value="3000">〜3,000円</option>
            <option value="4000">〜4,000円</option>
            <option value="5000">〜5,000円</option>
            <option value="7000">〜7,000円</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">並び替え</label>
          <select id="sort">
            <option value="area">エリア順</option>
            <option value="priceAsc">料金が安い順</option>
            <option value="priceDesc">料金が高い順</option>
            <option value="name">ホテル名順</option>
          </select>
        </div>
        <button id="reset" class="reset" type="button">条件をクリア</button>
      </div>
    </section>

    <section class="map-section" aria-labelledby="mapTitle">
      <h2 id="mapTitle" class="sec-title">地図で探す</h2>
      <p class="map-lead">ピンをタップすると、ホテル名と料金の目安が出ます。上の条件で絞り込むと、地図のピンも連動します。</p>
      <div id="map" class="map" role="region" aria-label="ブッフェの地図"></div>
      <p class="map-note" id="mapNote"></p>
    </section>

    <p class="count" id="count" aria-live="polite"></p>
    <section class="grid" id="list"></section>

    <section class="notice">
      <h2>ご利用にあたって</h2>
      <p>掲載している料金・営業時間は、各カードに記載の確認日時点で公開されていた情報をもとにした<strong>目安</strong>です。季節フェア、曜日、宿泊の有無、サービス料などで変わります。ご予約・ご来店の前に、必ず各ホテルの公式サイトで最新情報をご確認ください。</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 沖縄ホテルブッフェ帖</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
